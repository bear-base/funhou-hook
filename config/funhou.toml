[[rules]]
match = "Read|Glob|Grep"
level = "info"

[[rules]]
match = "Notification(idle_prompt)"
level = "warning"

[[rules]]
match = "Notification(permission_prompt)"
level = "danger"

[[rules]]
match = "Edit(*.env*)"
level = "danger"

[[rules]]
match = "Bash(*deploy*|*migrate*)"
level = "danger"

[[rules]]
match = "Bash(*test*|*lint*)"
level = "info"

[defaults]
level = "warning"

[channels.terminal]
output = "/tmp/funhou.log"
levels = ["info", "warning", "danger", "error"]

[channels.slack]
enabled = true
levels = ["info", "warning", "danger", "error"]
message_types = ["log", "summary", "approval"]
mention_on = []

[summary]
enabled = true
provider = "gemini"
model = "gemini-3.0-flash"
state_path = "/tmp/funhou-summary-state.json"
max_log_chars = 8000
timeout_sec = 10.0
